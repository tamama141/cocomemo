          }
        }
        expanded.add(cat);render();notifyStock();
        e.preventDefault();e.stopPropagation();
      }
      document.addEventListener('pointermove',move,{passive:false});
      document.addEventListener('pointerup',endDrag);
      document.addEventListener('pointercancel',endDrag);
    });
  });
}
function showToast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}function openModal(){if(!selected.size)return;states=[0,0];foldOpen=false;$('#modalback').hidden=false;$('#modalCount').textContent=selected.size+'件の'+(kind==='pantry'?'食材':'レシピ')+'を選択中';$('#foldTitle').textContent=kind==='pantry'?'🏷️ カテゴリを変更':'🏷️ タグを変更';$('#move').hidden=kind!=='pantry';makeToggle();makeFold()}const labels=['変更なし','ON','OFF'];function makeToggle(){$('#toggles').innerHTML=(kind==='pantry'?[['💫','優先使用'],['❄️','冷凍']]:[['⭐','お気に入り'],['🔖','ブックマーク']]).map((x,i)=>'<button class="state" data-state="'+i+'" aria-label="'+x[1]+' '+labels[states[i]]+'"><b>'+x[0]+'</b>：'+labels[states[i]]+'</button>').join('');document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{const i=+b.dataset.state;states[i]=(states[i]+1)%3;makeToggle()})}function makeFold(){$('#foldBtn').setAttribute('aria-expanded',String(foldOpen));$('#foldBody').hidden=!foldOpen;$('#foldArrow').textContent=foldOpen?'▴':'▾';if(!foldOpen)return;$('#foldBody').innerHTML=kind==='pantry'?'<label><input type="radio" name="categoryMove" checked> 変更しない</label>'+cats().map(c=>'<label><input type="radio" name="categoryMove"> '+escapeHTML(c)+'</label>').join(''):'<label><input type="checkbox" id="bulkTagEnable"> タグを変更する</label><div class="hint" style="margin:4px 0">選択するタグとメインタグを指定（表示見本）</div>'+['主菜','副菜','汁物','時短'].map((t,i)=>'<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" name="bulkTag" value="'+t+'"> <span style="flex:1">'+t+'</span><input type="radio" name="mainTag" aria-label="'+t+'をメインタグに指定" '+(i===0?'':'')+'></label>').join('')}
$('#pantryBtn').onclick=()=>changeKind('pantry');$('#cocoBtn').onclick=()=>changeKind('coco');$('#search').oninput=render;$('#sortToggle').onclick=()=>togglePicker('sort');$('#categoryToggle').onclick=()=>togglePicker('category');
$('#clear').onclick=()=>{reset()};
$('#select').onclick=()=>{selectMode=!selectMode;selected.clear();closePicker();render()};
document.addEventListener('click',e=>{if(!e.target.closest('.custom-picker'))closePicker()});
window.addEventListener('resize',()=>renderPickers());
$('#cancelSelect').onclick=reset;$('#edit').onclick=openModal;$('#closeModal').onclick=()=>$('#modalback').hidden=true;$('#foldBtn').onclick=()=>{foldOpen=!foldOpen;makeFold()};$('#save').onclick=()=>{showToast('表示を確認しました。実データは変更されません');$('#modalback').hidden=true;selectMode=false;selected.clear();render()};$('#move').onclick=()=>{const rows=pantryData.filter(x=>selected.has(x.id)).map(x=>({...x}));if(rows.length){window.parent.postMessage({channel:'stock-to-wish',rows},location.origin);$('#modalback').hidden=true;selectMode=false;selected.clear();render()}};$('#delete').onclick=()=>{if(confirm('確認用：'+selected.size+'件を削除しますか？\n※実際のデータは変更しません'))showToast('確認用：削除の確認のみ。実際には削除しません')};$('#modalback').onclick=e=>{if(e.target===$('#modalback'))$('#modalback').hidden=true};document.addEventListener('pointerdown',e=>{if(qtyOpen!==null&&!e.target.closest('.qty-slot')&&!e.target.closest('.qty-popover')){qtyOpen=null;render()}});window.addEventListener('resize',()=>{if(qtyOpen!==null){qtyOpen=null;render()}});document.addEventListener('scroll',e=>{if(qtyOpen!==null&&!e.target.closest?.('.picker-menu')){qtyOpen=null;render()}},true);changeKind('pantry');
;
const notifyStock=()=>window.parent.postMessage({channel:'stock-state',rows:pantryData.map(x=>({...x}))},location.origin);
$('#bridge-add').onclick=()=>window.parent.postMessage({channel:'open-add',target:'stock'},location.origin);
window.addEventListener('message',e=>{
 if(e.origin!==location.origin)return;const d=e.data;if(!d||d.scope!=='pan-bridge')return;
 if(d.op==='viewport'){document.documentElement.style.setProperty('--visible-top',d.visibleTop+'px');document.documentElement.style.setProperty('--visible-height',d.visibleHeight+'px');return}
if(d.op==='stock-get'){notifyStock();return}
 if(d.op==='stock-add'){
  const done=[];let refused=0;
  for(const entry of d.rows||[]){
   if(!entry.name?.trim()||pantryData.some(x=>x.name===entry.name.trim()&&x.cat===entry.cat)){refused++;continue}
   const item={id:Math.max(0,...pantryData.map(x=>x.id))+1,name:entry.name.trim(),cat:entry.cat,qty:(entry.qty||'')+(entry.qty?entry.unit||'':''),unit:entry.unit||'',date:entry.date||'',priority:!!entry.priority,frozen:!!entry.frozen,memo:entry.memo||''};
   pantryData.push(item);done.push(entry.originId??null)
  }
  for(const entry of d.rows||[])if(pantryData.some(x=>x.name===entry.name?.trim()&&x.cat===entry.cat))expanded.add(entry.cat);
  render();notifyStock();
  window.parent.postMessage({channel:'stock-added',requestId:d.requestId,done,refused},location.origin);return
 }
 if(d.op==='stock-update'){
   const existing=pantryData.find(x=>x.id===d.id),entry=d.row;
   if(!existing||!entry?.name?.trim()||pantryData.some(x=>x.id!==d.id&&x.name===entry.name.trim()&&x.cat===entry.cat)){
     window.parent.postMessage({channel:'stock-update-failed',requestId:d.requestId},location.origin);return;
   }
   Object.assign(existing,{name:entry.name.trim(),cat:entry.cat,qty:(entry.qty||'')+(entry.qty?entry.unit||'':''),unit:entry.unit||'',date:entry.date||'',priority:!!entry.priority,frozen:!!entry.frozen,memo:entry.memo||''});
   expanded.add(existing.cat);render();notifyStock();
   window.parent.postMessage({channel:'stock-updated',requestId:d.requestId},location.origin);return;
 }
 if(d.op==='stock-remove'){
   for(const id of d.ids||[]){const idx=pantryData.findIndex(x=>x.id===id);if(idx>=0)pantryData.splice(idx,1)}
   render();notifyStock();
   window.parent.postMessage({channel:'stock-removed',requestId:d.requestId},location.origin);return
 }
 if(d.op==='stock-announce'){showToast(d.text);return}
});
notifyStock();
</script></body></html>
