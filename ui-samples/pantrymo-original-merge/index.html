<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#345d4b"><title>Pantrymo｜原本ベース・統合比較 修正 v2</title><style>
:root{font:15px system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f7f3;color:#2e342f}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}button,select,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #54896b;outline-offset:2px}
main{max-width:1020px;margin:auto;padding:13px 15px 90px;background:#fbfcfa;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dbe5dc;padding:4px 0 13px}.brand{font-size:23px;color:#3c6550;font-weight:850}.tag{font-size:11px;color:#687a6d}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:13px 0}nav button{min-width:0;border:1px solid #cfdcd1;border-radius:10px;background:white;text-align:center;padding:11px 3px;color:#537260;font-size:clamp(11px,2.9vw,14px)}nav button.active{background:#e1eee5;color:#2d6042;font-weight:750;border-color:#a8cfb4}
.frame{width:100%;border:0;display:block;min-height:620px;background:#fbfcfa}#frame-stock{margin-top:0}.notice{font-size:12px;color:#697d6d;padding:10px 12px;background:#f2f7ec;border:1px solid #dbe7d2;border-radius:9px;line-height:1.6;margin:13px 0}
dialog{border:0;border-radius:14px;padding:0;width:min(570px,calc(100vw - 22px));max-height:90dvh;overflow:auto;box-shadow:0 20px 60px #17332255;color:#304038}dialog::backdrop{background:#162a2070}
.head{padding:14px 17px;border-bottom:1px solid #deeadf;display:flex;align-items:center;justify-content:space-between;font-weight:800;color:#365f48}
.x{border:0;background:transparent;font-size:24px;color:#6d8072}.body{padding:15px 16px 19px}.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#52715b;font-weight:650;min-width:0}
.field input,.field select{height:40px;border:1px solid #c9dacc;border-radius:8px;background:#fff;width:100%;min-width:0;padding:8px 10px;color:#2e4032;font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.68fr) minmax(0,.75fr);gap:7px;margin:10px 0}.grid.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}.grid.third{grid-template-columns:1fr 1fr}.switches{display:flex;align-items:end;gap:5px}.switches button{border:1px solid #c8dbcd;background:#f4f9f5;color:#506d55;border-radius:8px;min-height:40px;min-width:58px;padding:5px}.switches button.on{background:#e0eee5;color:#2d7149;border-color:#83ba96}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:15px}.primary{background:#345d4b;border:1px solid #345d4b;border-radius:8px;color:white;font-weight:700;padding:10px 15px}.soft{background:#f3f8f3;border:1px solid #cad9cd;border-radius:8px;color:#456951;padding:10px 15px}.error{color:#b14636;font-size:12px;min-height:16px}
.move-row{border:1px solid #d8e4db;border-radius:10px;padding:10px;margin:9px 0;background:white}.move-row.invalid{background:#fff9f7;border-color:#dfb4a7}
.move-top{display:flex;gap:7px;align-items:center}.move-top input{flex:1;min-width:0;border:1px solid #cadbce;border-radius:7px;padding:9px 8px;font-weight:600}.move-top button{border:0;background:transparent;color:#b37571;font-size:21px}
.move-fields{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.7fr) minmax(0,.75fr);gap:7px;margin-top:8px}.move-fields label{font-size:11px;color:#617d69}.move-fields input,.move-fields select{border:1px solid #cadbce;border-radius:7px;padding:7px;width:100%;min-width:0;background:white;font-size:13px;display:block;margin-top:3px}
.move-extra{margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.move-extra button{border:1px solid #d1e0d3;border-radius:7px;background:#f6faf6;padding:6px;color:#59715d}.move-extra button.on{background:#e2f0e4;border-color:#9ac8a2}.move-extra label{margin-left:auto;font-size:11px;color:#607862}.move-extra input{display:block;border:1px solid #caddce;border-radius:6px;padding:6px;width:130px;font-size:12px}
.reg{font-size:11px;color:#b14e3c;padding:5px 1px}.explain{font-size:12px;line-height:1.7;color:#667d6c}.status{margin:10px 0;color:#4b745b;font-size:13px}.placeholder{padding:20px;background:white;border:1px solid #deeadf;border-radius:10px}
@media(min-width:700px){.grid{gap:10px}.frame{max-width:100%}}@media(max-width:400px){main{padding-inline:9px}.grid{gap:5px}.field input,.field select{padding:7px 6px}.switches button{min-width:45px}.tag{font-size:9px}}
/* Pumpkin palette for integrated sample */
:root{background:#fff9f0;color:#222b23}main{background:#fffaf4}.brand{color:#104d32}nav button{color:#15472f;border-color:#d5cbbd;background:#fffdf9}nav button.active{background:#104d32;color:#fff;border-color:#104d32}.head{color:#104d32}.primary{background:#e77b07;border-color:#e77b07;color:white}.soft{background:#fff5dd;color:#164631;border-color:#e1d0a9}input::placeholder,textarea::placeholder{color:#a0a6a0!important;opacity:1}.switches button,.move-extra button{min-width:78px;min-height:40px;white-space:nowrap}.switches button.on,.move-extra button.on{background:#ffda90;border-color:#e6a13b;color:#473017}.count-field{display:flex;align-items:center;gap:2px;min-width:0}.count-field input{flex:1;min-width:0;width:40px;text-align:center;padding:2px}.count-field .count-step{flex:none;border:1px solid #b4cbb6;background:#e4f1e5;color:#155238;border-radius:7px;width:27px;height:36px;padding:0;font-size:19px}.move-fields label .count-field{margin-top:3px}.move-fields label .count-field input{margin:0}.move-fields .count-field .count-step{width:25px;height:34px}.grid:not(.two):not(.third){grid-template-columns:minmax(0,1.15fr) minmax(97px,.95fr) minmax(57px,.6fr)}dialog:focus{outline:none}
/* Revision ①②: icon toggles, blank form fields */
.switches{min-width:0;justify-content:flex-end;gap:6px}.switches button,.move-extra button[data-mpriority],.move-extra button[data-mfrozen]{flex:none;width:36px;min-width:36px!important;max-width:36px;height:36px;min-height:36px!important;padding:0!important;font-size:18px;line-height:1;filter:grayscale(1);opacity:.5;background:#f4f6f3;border:1px solid #c6d6c9;color:#315a42}.switches button.on,.move-extra button.on{filter:none;opacity:1;background:#fff4de;border-color:#eba83c}.grid.two{grid-template-columns:minmax(0,1fr) auto}.move-extra button[data-mfrozen].on,.switches #add-frozen.on{background:#eaf6ff;border-color:#91cee9}.grid:not(.two):not(.third){grid-template-columns:minmax(0,1fr) minmax(119px,1fr) minmax(51px,.45fr)}.count-field{width:100%;gap:2px}.count-field .count-step{width:28px;min-width:28px;height:36px}.count-field input{width:100%;height:40px;min-width:0}.field input::placeholder,.move-fields input::placeholder{color:transparent!important}#add-dialog{max-width:calc(100vw - 18px)}
/* Edit dialog: compact numeric column, keep surrounding fields and existing actions. */
#add-dialog .grid:not(.two):not(.third){grid-template-columns:minmax(0,1.75fr) 142px minmax(70px,.78fr)!important}
#add-dialog .count-field{display:grid!important;grid-template-columns:29px minmax(0,1fr) 29px!important;gap:3px!important}
#add-dialog .count-field input{min-width:0!important;width:100%!important;height:40px!important;font-size:14px!important}
#add-dialog .count-field .count-step{width:29px!important;min-width:29px!important}
#add-dialog .actions{display:flex!important;flex-wrap:wrap!important;gap:8px!important;justify-content:flex-end!important}
#add-dialog .actions button{min-height:43px!important;font-size:14px!important;white-space:normal}
#add-dialog .actions button[hidden]{display:none!important}
#add-dialog .danger-button,#stock-delete-confirm .danger-button{background:#fff6f5;color:#b34c48;border:1px solid #ead7d3;border-radius:9px;padding:9px 14px;font-weight:700}
#add-dialog #stock-one-move{margin-right:auto;max-width:100%}
#stock-delete-confirm{width:min(480px,calc(100vw - 22px))}
@media(max-width:430px){#add-dialog .grid:not(.two):not(.third){grid-template-columns:minmax(0,1.5fr) 122px minmax(64px,.72fr)!important}#add-dialog .count-field{grid-template-columns:25px minmax(0,1fr) 25px!important}#add-dialog .count-field .count-step{width:25px!important;min-width:25px!important}}
@media(max-width:360px){#add-dialog .grid:not(.two):not(.third){grid-template-columns:minmax(0,1fr) 112px minmax(54px,.5fr)!important}#add-dialog .grid{gap:4px!important}}
body.child-modal-active nav,body.child-modal-active header,body.child-modal-active #global-status{pointer-events:none!important}
body.child-modal-active{overscroll-behavior:none!important}
/* Match child dialog backdrops across the *entire* parent viewport.
   The iframe draws the center; these two layers darken only the exposed
   header and side gutters, leaving the dialog itself untouched. */
body.child-modal-active::before,body.child-modal-active::after{
 content:"";position:fixed;pointer-events:none;z-index:70}
body.child-modal-active::before{top:0;left:0;right:0;height:var(--modal-frame-top,0px);background:#162a2070}
body.child-modal-active::after{inset:0;background:linear-gradient(to right,
 #162a2070 0 var(--modal-frame-left,0px),
 transparent var(--modal-frame-left,0px) var(--modal-frame-right,100vw),
 #162a2070 var(--modal-frame-right,100vw) 100%)}

/* Wish single-add: category and memo each occupy a full-width row. */
#add-dialog .grid.third:has(#date-field[hidden]){grid-template-columns:minmax(0,1fr)!important}
#add-dialog .grid.third:has(#date-field[hidden]) #add-memo{width:100%!important}
</style></head><body><main>
<header><span class="brand">Pantrymo</span><span class="tag">原本ベース・統合比較 v2</span></header>
<nav aria-label="画面切り替え"><button type="button" class="active" data-nav="stock">ストックリスト</button><button type="button" data-nav="wish">マイウィッシュ</button><button type="button" data-nav="plus">アイテムプラス</button><button type="button" data-nav="coco">CocoMemo</button></nav>
<iframe id="frame-stock" title="ストックリスト 原本ベース" class="frame" src="stock.html"></iframe>
<iframe id="frame-wish" title="マイウィッシュ・アイテムプラス 原本ベース" class="frame" src="wish-plus.html" hidden></iframe>
<section id="coco-placeholder" hidden class="placeholder">CocoMemoの画面・データは、今回のPantrymo比較サンプルでは変更していません。</section>

<p class="status" id="global-status" role="status"></p>
</main>
<dialog id="add-dialog" tabindex="-1" autofocus aria-label="1品追加"><div class="head"><span id="add-title">1品追加</span><button class="x" id="add-x" type="button" aria-label="閉じる">×</button></div><div class="body">
<div class="grid"><label class="field">品名<input id="add-name"  autocomplete="off"></label><label class="field">数量<input id="add-qty" inputmode="decimal" ></label><label class="field">単位<input id="add-unit" ></label></div>
<div class="grid two"><label class="field">カテゴリ<select id="add-cat"></select></label><div class="switches" id="add-flags"><button id="add-priority" type="button">💫 OFF</button><button id="add-frozen" type="button">❄️ OFF</button></div></div>
<div class="grid third"><label class="field">メモ<input id="add-memo" ></label><label class="field" id="date-field">ストック日<input id="add-date" type="date"></label></div>
<p class="error" id="add-error"></p><div class="actions"><button class="soft" id="stock-one-move" hidden>マイウィッシュへ移動</button><button class="danger-button" id="stock-one-delete" type="button" hidden>削除</button><button class="soft" id="add-cancel">取消</button><button class="primary" id="add-save">登録</button></div></div></dialog>
<dialog id="stock-delete-confirm" aria-label="ストック削除の確認"><div class="head"><span>削除の確認</span><button type="button" class="x" id="stock-delete-x">×</button></div><div class="body"><p id="stock-delete-text">このストックを削除しますか？</p><div class="actions"><button class="soft" id="stock-delete-cancel">戻る</button><button class="danger-button" id="stock-delete-ok">削除する</button></div></div></dialog>
<dialog id="move-dialog" aria-label="ストックへの移動を確認"><div class="head">ストックリストへ移動<button class="x" id="move-x" aria-label="閉じる">×</button></div><div class="body"><div id="move-items"></div><p class="status" id="move-status"></p><div class="actions"><button class="soft" id="move-cancel">キャンセル</button><button class="primary" id="move-save">移動を確定</button></div></div></dialog>
<dialog id="duplicate-dialog" aria-label="登録済みのご案内"><div class="head">ご案内</div><div class="body"><p class="explain">ストックリストに登録済みのものは、移動できません。<br>確認リストから除外するか、品名またはカテゴリを変更して下さい。</p><div class="actions"><button class="primary" id="duplicate-ok">OK</button></div></div></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),origin=location.origin;
const stockFrame=$('frame-stock'),wishFrame=$('frame-wish');
const food=['野菜・きのこ','精肉・加工肉','魚介・海藻','豆腐・こんにゃく類','卵・乳製品','果物','ジャム・シロップ類','漬物・保存食','加工食品・レトルト','米・パン・麺類','粉類・製菓材料','乾物・その他','調味料','だし・スープの素','香辛料・ハーブ','酒類','カテゴリ未定'];
const cats=[...food.slice(0,-1),'日用品ほか','カテゴリ未定'];
let stock=[],wish=[],mode='stock',newTarget='stock',priority=false,frozen=false,editingStockId=null,review=[],requests=new Map(),sequence=1;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const k=x=>String(x.name||'').trim()+'\u001f'+x.cat;
const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const has=x=>stock.some(y=>k(y)===k(x));
const fmtDate=x=>{const m=String(x||"").match(/^(?:\d{4}[-/])?(\d{1,2})[-/](\d{1,2})$/);return m?m[1]+"/"+m[2]:""};
let editingOriginalDate="",editingInitialISO="";
function send(f,op,payload={}){if(f.contentWindow)f.contentWindow.postMessage({scope:'pan-bridge',op,...payload},origin)}
function toast(t){$('global-status').textContent=t}
function setMode(v){mode=v;stockFrame.hidden=v!=='stock';wishFrame.hidden=v!=='wish'&&v!=='plus';$('coco-placeholder').hidden=v!=='coco';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===v));if(v==='wish'||v==='plus')send(wishFrame,'wish-view',{view:v});}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setMode(b.dataset.nav));
function syncFrameViewport(frame){const r=frame.getBoundingClientRect(),top=Math.max(0,-r.top),height=Math.max(100,Math.min(r.height-top,innerHeight-Math.max(0,r.top)));send(frame,'viewport',{visibleTop:top,visibleHeight:height})}
const syncViewports=()=>{syncFrameViewport(stockFrame);syncFrameViewport(wishFrame)};window.addEventListener('scroll',syncViewports,{passive:true});window.addEventListener('resize',syncViewports);
function resizeFrame(frame){
 try{const doc=frame.contentDocument;if(!doc)return;const resize=()=>{const box=doc.querySelector('.app,.wrap')||doc.body;const h=box.scrollHeight;const next=Math.max(650,h+8);if(Math.abs(parseFloat(frame.style.height||0)-next)>3)frame.style.height=next+'px'};new ResizeObserver(()=>{resize();syncFrameViewport(frame)}).observe(doc.body);resize();syncFrameViewport(frame)}catch(e){console.warn('Frame resize unavailable',e)}
}
stockFrame.onload=()=>{resizeFrame(stockFrame);send(stockFrame,'stock-get')};
wishFrame.onload=()=>{resizeFrame(wishFrame);send(wishFrame,'wish-view',{view:mode==='wish'?'wish':'plus'});send(wishFrame,'wish-get')};
function fmtUnit(x){if(x.unit)return x.unit;return String(x.qty||'').match(/(?:パック|ケース|ボトル|キロ|グラム|リットル|切れ|袋|本|個|枚|束|缶|箱|玉|粒|丁|房|杯|kg|ml|g|L)$/)?.[0]||''}
function openAdd(target,row=null){editingOriginalDate=row?.date||"";editingInitialISO=editingOriginalDate?(editingOriginalDate.match(/^\d{4}-/)?editingOriginalDate:day().slice(0,4)+"-"+fmtDate(editingOriginalDate).split("/").map(x=>x.padStart(2,"0")).join("-")):"";newTarget=target;editingStockId=row?.id??null;priority=!!row?.priority;frozen=!!row?.frozen;
 $('add-title').textContent=target==='stock'?(row?'ストックを編集':'ストックリストに1品追加'):'マイウィッシュに1品追加';
 $('add-name').value=row?.name||'';$('add-qty').value=row?.qty?String(row.qty).match(/^\d+(?:\.\d+)?/)?.[0]||'':'';$('add-unit').value=row?fmtUnit(row):'';$('add-memo').value=row?.memo||'';
 const el=$('add-cat');el.replaceChildren(...(target==='stock'?food:cats).map(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;return o}));el.value=row?.cat||'カテゴリ未定';
 $('add-date').value=row?editingInitialISO:day();$('date-field').hidden=target!=='stock';$('add-flags').hidden=target!=='stock';$('add-error').textContent='';flip();$('add-save').textContent=row?'変更':'登録';$('stock-one-move').hidden=!(target==='stock'&&row);$('stock-one-delete').hidden=!(target==='stock'&&row);$('add-cancel').hidden=!!row;$('add-dialog').showModal();requestAnimationFrame(()=>$('add-dialog').focus({preventScroll:true}))
}
function flip(){for(const [id,glyph,on,label] of [['add-priority','💫',priority,'優先使用'],['add-frozen','❄️',frozen,'冷凍']]){const el=$(id);el.textContent=glyph;el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));el.setAttribute('aria-label',label+(on?'オン':'オフ'))}}
function addCounter(id){const input=$(id),box=document.createElement('span');box.className='count-field';input.parentNode.insertBefore(box,input);box.append(input);for(const [txt,step] of [['−',-1],['＋',1]]){const b=document.createElement('button');b.type='button';b.className='count-step';b.textContent=txt;b.onclick=()=>{input.value=String(Math.max(0,(Number(input.value)||0)+step));input.dispatchEvent(new Event('input',{bubbles:true}))};box.insertBefore(b,step<0?input:null)}}addCounter('add-qty');
$('add-priority').onclick=()=>{priority=!priority;flip()};$('add-frozen').onclick=()=>{frozen=!frozen;flip()};
$('add-x').onclick=$('add-cancel').onclick=()=>$('add-dialog').close();
$('stock-one-delete').onclick=()=>{const row=stock.find(x=>x.id===editingStockId);if(!row)return;$('stock-delete-text').textContent='「'+row.name+'」をストックリストから削除しますか？';$('stock-delete-confirm').showModal()};
$('stock-delete-x').onclick=$('stock-delete-cancel').onclick=()=>$('stock-delete-confirm').close();
$('stock-delete-ok').onclick=()=>{const id=editingStockId;if(id===null)return;request('stock-remove',stockFrame,{ids:[id]},{type:'stock-edit-delete'});$('stock-delete-confirm').close();$('add-dialog').close()};
$('stock-one-move').onclick=()=>{const row=stock.find(x=>x.id===editingStockId);if(!row)return;request('wish-from-stock',wishFrame,{rows:[row]},{type:'stock-to-wish',ids:[row.id]});$('add-dialog').close()};
function request(op,frame,payload,meta){const requestId=sequence++;requests.set(requestId,meta);send(frame,op,{requestId,...payload})}
$('add-save').onclick=()=>{
 const name=$('add-name').value.trim(),qty=$('add-qty').value.trim(),cat=$('add-cat').value;
 if(!name){$('add-error').textContent='品名を入力してください。';return}
 if(qty&&!/^\d+(?:\.\d+)?$/.test(qty)){$('add-error').textContent='数量は数字か空欄で入力してください。';return}
 const x={name,cat,qty,unit:$('add-unit').value.trim(),memo:$('add-memo').value,priority,frozen,date:editingStockId!==null&&$('add-date').value===editingInitialISO?editingOriginalDate:$('add-date').value};
 if(newTarget==='stock'){
  if(stock.some(y=>k(y)===k(x)&&y.id!==editingStockId)){$('add-error').textContent='登録済みです。品名またはカテゴリを変更して下さい。';return}
  if(editingStockId!==null){
    // Stock原本では編集画面が表示見本のみだったため、削除→新規登録の間を一連の模擬操作として扱う。
    request('stock-update',stockFrame,{id:editingStockId,row:x},{type:'stock-edit-update'});return;
  }
  request('stock-add',stockFrame,{rows:[x]},{type:'single-stock'});return;
 }
 send(wishFrame,'wish-add',{rows:[x]});$('add-dialog').close();toast('マイウィッシュに1品登録しました（模擬）');
};
function startReview(rows){review=rows.filter(x=>x.cat!=='日用品ほか'&&!x.archived).map(x=>({originId:x.id,name:x.name,cat:x.cat,qty:'',unit:x.unit||'',memo:x.memo||'',priority:false,frozen:false,date:day(),excluded:false}));
 if(!review.length){toast('移動できる食材がありません（日用品・アーカイブは対象外）。');return}
 $('move-dialog').showModal();drawReview();
 if(review.some(x=>has(x)))$('duplicate-dialog').showModal();
}
$('duplicate-ok').onclick=()=>$('duplicate-dialog').close();
$('move-x').onclick=$('move-cancel').onclick=()=>$('move-dialog').close();
function duplicated(i){const x=review[i];return has(x)||review.some((y,j)=>i!==j&&!y.excluded&&k(x)===k(y))}
function drawReview(){
 const root=$('move-items');root.replaceChildren();
 review.forEach((x,i)=>{
 if(x.excluded)return;const duplicate=duplicated(i);const row=document.createElement('div');row.className='move-row'+(duplicate?' invalid':'');
 row.innerHTML='<div class="move-top"><input data-mname="'+i+'" aria-label="品名" value="'+esc(x.name)+'"><button type="button" data-exclude="'+i+'" title="今回の移動から除外">×</button></div>'+
 (duplicate?'<div class="reg">登録済み</div>':'')+
 '<div class="move-fields"><label>カテゴリ<select data-mcat="'+i+'">'+food.map(c=>'<option value="'+esc(c)+'" '+(x.cat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select></label><label>数量<input data-mqty="'+i+'" inputmode="decimal" placeholder="未指定" value="'+esc(x.qty)+'"></label><label>単位<input data-munit="'+i+'" value="'+esc(x.unit)+'"></label></div>'+
 '<div class="move-extra"><button type="button" data-mpriority="'+i+'" class="'+(x.priority?'on':'')+'" aria-label="優先使用" aria-pressed="'+x.priority+'">💫</button><button type="button" data-mfrozen="'+i+'" class="'+(x.frozen?'on':'')+'" aria-label="冷凍" aria-pressed="'+x.frozen+'">❄️</button><label>ストック日<input type="date" data-mdate="'+i+'" value="'+esc(x.date)+'"></label></div>';
 root.append(row)
 });
 root.querySelectorAll('[data-mname]').forEach(el=>el.oninput=()=>{review[+el.dataset.mname].name=el.value;updateDupes()});
 root.querySelectorAll('[data-mcat]').forEach(el=>el.onchange=()=>{review[+el.dataset.mcat].cat=el.value;drawReview()});
 root.querySelectorAll('[data-mqty]').forEach(el=>{el.oninput=()=>review[+el.dataset.mqty].qty=el.value;const box=document.createElement('span');box.className='count-field';el.parentNode.insertBefore(box,el);box.append(el);for(const [txt,step] of [['−',-1],['＋',1]]){const b=document.createElement('button');b.type='button';b.className='count-step';b.textContent=txt;b.onclick=()=>{el.value=String(Math.max(0,(Number(el.value)||0)+step));el.dispatchEvent(new Event('input'))};box.insertBefore(b,step<0?el:null)}});
 root.querySelectorAll('[data-munit]').forEach(el=>el.oninput=()=>review[+el.dataset.munit].unit=el.value);
 root.querySelectorAll('[data-mdate]').forEach(el=>el.onchange=()=>review[+el.dataset.mdate].date=el.value);
 root.querySelectorAll('[data-mpriority]').forEach(el=>el.onclick=()=>{review[+el.dataset.mpriority].priority=!review[+el.dataset.mpriority].priority;drawReview()});
 root.querySelectorAll('[data-mfrozen]').forEach(el=>el.onclick=()=>{review[+el.dataset.mfrozen].frozen=!review[+el.dataset.mfrozen].frozen;drawReview()});
 root.querySelectorAll('[data-exclude]').forEach(el=>el.onclick=()=>{review[+el.dataset.exclude].excluded=true;drawReview()});
 updateDupes();
}
function updateDupes(){for(const el of $('move-items').querySelectorAll('[data-mname]')){const i=+el.dataset.mname,duplicate=duplicated(i),row=el.closest('.move-row');row.classList.toggle('invalid',duplicate);let note=row.querySelector('.reg');if(duplicate&&!note){note=document.createElement('div');note.className='reg';note.textContent='登録済み';el.parentElement.after(note)}if(!duplicate&&note)note.remove()}
 $('move-status').textContent='移動可能 '+review.filter((x,i)=>!x.excluded&&x.name.trim()&&!duplicated(i)).length+'件';
}
$('move-save').onclick=()=>{
 const eligible=review.filter((x,i)=>!x.excluded&&x.name.trim()&&!duplicated(i)&&(!x.qty||/^\d+(?:\.\d+)?$/.test(x.qty)));
 if(eligible.length)request('stock-add',stockFrame,{rows:eligible},{type:'wish-to-stock',duplicates:review.some((x,i)=>!x.excluded&&duplicated(i))});
 else{$('move-dialog').close();toast('移動可能な品目はありません。元のマイウィッシュは残しています。')}
};
const frameModalStates=new Map();
window.addEventListener('message',e=>{
 if(e.origin!==origin)return;const d=e.data||{};
 if(d.channel==='frame-modal-state'){
  if(e.source===stockFrame.contentWindow||e.source===wishFrame.contentWindow){
   frameModalStates.set(e.source,!!d.active);const locked=[...frameModalStates.values()].some(Boolean);
   if(locked){
    const activeFrame=frameModalStates.get(stockFrame.contentWindow)?stockFrame:wishFrame;
    const rect=activeFrame.getBoundingClientRect();
    document.body.style.setProperty('--modal-frame-top',Math.max(0,rect.top)+'px');
    document.body.style.setProperty('--modal-frame-left',Math.max(0,rect.left)+'px');
    document.body.style.setProperty('--modal-frame-right',Math.min(innerWidth,rect.right)+'px');
   }
   document.body.classList.toggle('child-modal-active',locked);document.body.style.overflow=locked?'hidden':'';
  }return;
 }
 if(e.source===stockFrame.contentWindow){
   if(d.channel==='stock-state')stock=d.rows||[];
   if(d.channel==='open-add')openAdd('stock');
   if(d.channel==='stock-edit')openAdd('stock',d.row);
   if(d.channel==='stock-to-wish'){
     const rows=d.rows||[];if(rows.length)request('wish-from-stock',wishFrame,{rows},{type:'stock-to-wish',ids:rows.map(x=>x.id)});
   }
   if(d.channel==='stock-added'){
     const meta=requests.get(d.requestId);requests.delete(d.requestId);if(!meta)return;
     if(meta.type==='single-stock'||meta.type==='stock-edit-add'){$('add-dialog').close();toast('ストックリストへ登録しました（模擬）');return}
     if(meta.type==='plus-to-stock'){send(wishFrame,'plus-result',{added:d.done.filter(x=>x!==null).length,refused:d.refused,doneIds:d.done});toast('アイテムプラスからストックへ追加しました（模擬）');return}
     if(meta.type==='wish-to-stock'){const ids=d.done.filter(x=>x!==null);if(ids.length)send(wishFrame,'wish-remove',{ids});$('move-dialog').close();if($('duplicate-dialog').open)$('duplicate-dialog').close();toast(ids.length+'件をストックへ移動しました。'+(meta.duplicates||d.refused?' 重複品はマイウィッシュに保持しました。':''));return}
   }
   if(d.channel==='stock-updated'){const meta=requests.get(d.requestId);requests.delete(d.requestId);if(meta?.type==='stock-edit-update'){$('add-dialog').close();toast('ストックを更新しました（模擬）')}}
   if(d.channel==='stock-update-failed'){requests.delete(d.requestId);$('add-error').textContent='更新できませんでした。元の品目は保持しました。'}
   if(d.channel==='stock-removed'){const meta=requests.get(d.requestId);requests.delete(d.requestId);if(meta?.type==='stock-edit-remove')request('stock-add',stockFrame,{rows:[meta.newRow]},{type:'stock-edit-add'});if(meta?.type==='stock-to-wish')toast('マイウィッシュへ移動しました（数量は未指定）。');if(meta?.type==='stock-edit-delete')toast('ストックから削除しました（模擬）')}
 }
 if(e.source===wishFrame.contentWindow){
   if(d.channel==='wish-state')wish=d.rows||[];
   if(d.channel==='open-add')openAdd('wish');
   if(d.channel==='wish-to-stock')startReview(d.rows||[]);
   if(d.channel==='plus-to-stock')request('stock-add',stockFrame,{rows:d.rows||[]},{type:'plus-to-stock'});
   if(d.channel==='wish-saved'){const meta=requests.get(d.requestId);requests.delete(d.requestId);if(meta?.type==='stock-to-wish')request('stock-remove',stockFrame,{ids:meta.ids},{type:'stock-to-wish'});}
   if(d.channel==='wish-failed'){requests.delete(d.requestId);toast('移動先の更新に失敗したため、ストック側の元データは保持しました。')}
 }
});
setMode('stock');
})();
</script></body></html>
