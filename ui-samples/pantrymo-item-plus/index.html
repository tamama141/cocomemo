<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315b48"><title>Pantrymo｜アイテムプラス確認用</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#304635;background:#f6f8f5;font-size:15px}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #629678;outline-offset:1px}.wrap{max-width:1050px;margin:auto;background:#fdfefd;padding:16px 16px 60px;min-height:100dvh}.brand{font-size:23px;font-weight:850;color:#37604a;padding:9px 0 14px;border-bottom:1px solid #d9e5dc}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}.nav>span{border:1px solid #cfddd0;border-radius:9px;min-width:0;padding:12px 3px;text-align:center;font-size:clamp(10px,2.8vw,14px);color:#426b51;overflow-wrap:anywhere}.nav .on{background:#e0eee4;font-weight:700}.card{background:#fff;border:1px solid #d9e6dc;border-radius:13px;padding:13px;margin:12px 0;box-shadow:0 2px 8px #274b2a07}.label{font-size:13px;font-weight:750;color:#436b50;margin-bottom:9px}.dest{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dest button{border:1px solid #cbdccf;background:#f9faf9;color:#3c644a;font-weight:700;border-radius:9px;padding:10px}.dest button.active{background:#507b60;color:#fff}.textarea{width:100%;height:123px;padding:12px;border-radius:9px;border:1px solid #bfd3c4;line-height:1.6;resize:vertical}.textarea::placeholder{color:#909d93;font-size:13px;opacity:1}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:700;color:#3e684a;background:#e9f3eb}.btn.primary{background:#3f7754;color:#fff}.btn.danger{color:#aa4545;background:#fff;border:1px solid #e6caca}.status{color:#438059;font-size:12px;margin-top:7px;min-height:1em}.head{display:flex;justify-content:space-between;align-items:center;color:#37634b;font-weight:750;margin-bottom:8px}.columns{display:grid;grid-template-columns:1fr;gap:13px}.cat{min-width:0}.band{background:#e8f1e9;border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;color:#3b664d;font-weight:750;font-size:13px;margin-bottom:3px}.count{font-weight:500;color:#64856e}.item{border-bottom:1px solid #e7eee7}.itemline{display:grid;grid-template-columns:22px 22px minmax(0,1fr) 92px 34px;gap:2px;align-items:center;min-height:41px}.itemline.wish{grid-template-columns:minmax(0,1fr) 92px 34px}.icon{border:0;background:transparent;font-size:17px;padding:0;opacity:.28;filter:grayscale(1)}.icon.on{filter:none;opacity:1}.name{min-width:0;width:100%;border:1px solid transparent;padding:5px 3px;background:transparent;border-radius:5px;color:#304534;font-weight:600;font-size:14px}.name:focus{border-color:#97b5a0}.qty{min-width:0;border:0;background:transparent;color:#465e4b;white-space:nowrap;font-size:13px;text-align:right;padding:8px 2px}.more{border:0;background:transparent;color:#426951;font-size:23px;font-weight:900;min-height:34px}.extra{font-size:12px;color:#69816d;padding:2px 5px 7px 48px}.extra.wish{padding-left:3px}.inlineqty{display:flex;gap:3px;align-items:center;justify-content:flex-end}.inlineqty button{border:0;background:#e9f3ea;padding:5px 8px;border-radius:5px;color:#376447;font-weight:800}.inlineqty span{font-size:12px;white-space:nowrap;max-width:70px;overflow:hidden}.foot{display:flex;justify-content:flex-end;margin-top:15px}.muted{color:#6b806d;font-size:12px}.preview{background:#f3f6ec;color:#697750;padding:10px;border-radius:7px;margin:12px 0;font-size:12px}.empty{padding:12px;font-size:13px;color:#708575}dialog{border:0;border-radius:15px;padding:0;width:min(480px,calc(100vw - 24px));max-height:calc(100dvh - 25px);overflow:auto;box-shadow:0 15px 55px #1b342a55}dialog::backdrop{background:#1b342a66}.modalhead{background:#e8f3e9;padding:12px 14px;color:#335c42;font-weight:750;display:flex;justify-content:space-between;align-items:center}.x{border:0;background:none;font-size:24px;color:#395f48}.modalbody{padding:13px}.editrow{display:grid;gap:7px;margin:7px 0;align-items:end}.r1{grid-template-columns:minmax(0,1fr) 52px 75px}.r2,.r3{grid-template-columns:134px minmax(0,1fr)}.r2.wish{grid-template-columns:1fr 1.1fr}.editlabel{font-size:11px;color:#5b765f;font-weight:700;min-width:0}.editlabel input,.editlabel select{display:block;margin-top:4px;width:100%;min-width:0;height:35px;padding:5px 6px;border:1px solid #c8d9ca;border-radius:7px;background:white;color:#294331;font-size:13px}.editlabel input[type=date]{font-size:12px;padding:4px 2px}.switches{display:flex;gap:5px}.switch{min-width:60px;flex:1;height:35px;display:flex;align-items:center;justify-content:center;gap:3px;border:1px solid #d5e0d5;border-radius:7px;color:#a0ada1;background:#f5f7f5;font-size:11px;font-weight:750}.switch.on{background:#e6f2e9;border-color:#95c4a1;color:#317847}.switch.snow.on{background:#eaf2ff;border-color:#a1c4ed;color:#337dc1}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}.actions button{border:1px solid #cddccc;background:white;border-radius:8px;padding:9px 3px;color:#42624b;font-weight:700}.actions .red{color:#b74b4b}.actions .primary{background:#477a57;color:white}.dateclear{border:0;background:none;color:#5b8264;padding:0;font-size:11px;margin-top:3px}.note{margin-top:12px;color:#6b7e70;font-size:12px}
@media(min-width:740px){.columns{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.wrap{padding:22px 28px 70px}.itemline{grid-template-columns:25px 25px minmax(0,1fr) 100px 39px;gap:4px}.itemline.wish{grid-template-columns:minmax(0,1fr) 100px 39px}.name{font-size:15px}.qty{font-size:14px}.more{font-size:24px}.cat{align-self:start}.band{font-size:14px}}
</style></head><body><main class="wrap">
<div class="brand">Pantrymo</div><nav class="nav" aria-label="デモメニュー"><span>ストックリスト</span><span>マイウィッシュ</span><span class="on">アイテムプラス</span><span>CocoMemo</span></nav>
<section class="card"><div class="label">追加先を選択</div><div class="dest"><button id="stockBtn" class="active" type="button">ストックリスト</button><button id="wishBtn" type="button">マイウィッシュ</button></div></section>
<section class="card"><label class="label" for="input">アイテムを入力</label><textarea id="input" class="textarea" placeholder="例：かぼちゃ1個、玉ねぎ␣3個、ひき肉1パック&#10;複数品目は「、」「,」または改行で区切ること。&#10;(␣はスペース)"></textarea><div class="toolbar"><button class="btn" id="example">入力例を試す</button><button class="btn primary" id="parse">アイテムを確認</button></div><div class="status" id="status"></div></section>
<section class="card"><div class="head">確認リスト</div><div id="columns" class="columns"></div><div class="foot"><button id="save" class="btn primary">ストックリストに追加</button></div></section>
<p class="preview">仕様確認用サンプルです。保存・削除・同期は実データに反映されません。入力内容はこのページ内だけで扱います。</p>
<dialog id="edit"><div class="modalhead"><span>アイテムを編集</span><button class="x" id="exit" aria-label="閉じる">×</button></div><div class="modalbody">
<div class="editrow r1"><label class="editlabel">アイテム名<input id="en"></label><label class="editlabel">数量<input id="eq" inputmode="decimal"></label><label class="editlabel">単位<input id="eu"></label></div>
<div id="stockLine" class="editrow r2"><div class="switches"><button type="button" id="ep" class="switch">💫 OFF</button><button type="button" id="ef" class="switch snow">❄️ OFF</button></div><label class="editlabel">カテゴリ<select id="ec"></select></label></div>
<div id="wishLine" class="editrow r2 wish" hidden><label class="editlabel">カテゴリ<select id="ew"></select></label><label class="editlabel">メモ<input id="wm"></label></div>
<div id="stockThird" class="editrow r3"><label class="editlabel">ストック日<input type="date" id="ed"><button class="dateclear" id="clearDate" type="button">日付を解除</button></label><label class="editlabel">メモ<input id="em"></label></div>
<div class="actions"><button id="cancel">取消</button><button id="delete" class="red">削除</button><button id="change" class="primary">変更</button></div></div></dialog>
</main>
<script>
(()=>{'use strict';
const cats=['野菜・きのこ','精肉・加工肉','魚介・海藻','豆腐・こんにゃく類','卵・乳製品','果物','ジャム・シロップ類','漬物・保存食','加工食品・レトルト','米・麺類','粉類・製菓材料','乾物・その他','調味料','だし・スープの素','香辛料・ハーブ','酒類','カテゴリ未定'];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let dest='stock',idx=-1,rows=[{name:'かぼちゃ',qty:'1',unit:'個',cat:0,priority:true,frozen:false,date:'',memo:''},{name:'玉ねぎ',qty:'3',unit:'個',cat:0,priority:false,frozen:false,date:'',memo:''},{name:'ひき肉',qty:'1',unit:'パック',cat:1,priority:false,frozen:true,date:'2026-11-07',memo:''}];
const categoryFor=name=>/かぼちゃ|玉ねぎ|トマト|人参|じゃがいも|キャベツ/.test(name)?0:/ひき肉|鶏|豚|牛肉/.test(name)?1:/牡蠣|魚|鮭/.test(name)?2:/卵|牛乳|チーズ/.test(name)?4:/パスタ|うどん|米/.test(name)?9:16;
const pattern=/^(.*?)\s*(\d+(?:\.\d+)?)\s*(パック|グラム|kg|ml|個|本|枚|袋|箱|缶|束|丁|玉|つ|瓶|g|L)$/i;
function parse(){const parts=$('input').value.split(/[\n、,]+/).map(x=>x.trim()).filter(Boolean);if(!parts.length){$('status').textContent='アイテムを入力してね。';return;}rows=parts.map(t=>{const m=t.match(pattern),name=(m?m[1]:t).trim();return{name,qty:m?.[2]||'',unit:m?.[3]||'',cat:categoryFor(name),priority:false,frozen:false,date:'',memo:''}});$('status').textContent=rows.length+'件を確認リストに表示しました。';render();}
function setDest(d){dest=d;$('stockBtn').classList.toggle('active',d==='stock');$('wishBtn').classList.toggle('active',d==='wish');$('save').textContent=(d==='stock'?'ストックリスト':'マイウィッシュ')+'に追加';render();}
function render(){let grouped=new Map();rows.forEach((r,i)=>{if(!grouped.has(r.cat))grouped.set(r.cat,[]);grouped.get(r.cat).push([r,i]);});const keys=[...grouped.keys()].sort((a,b)=>a-b);let cols=[[],[]],heights=[0,0];keys.forEach((k,n)=>{let col=0;if(k===0)col=0;else if(k===1||k===2)col=1;else col=heights[0]<=heights[1]?0:1;cols[col].push(k);heights[col]+=1+grouped.get(k).length;});$('columns').innerHTML=cols.map(keys=>'<div>'+keys.map(k=>'<div class="cat"><div class="band">'+esc(cats[k])+'<span class="count">'+grouped.get(k).length+'件</span></div>'+grouped.get(k).map(([r,i])=>'<div class="item"><div class="itemline '+(dest==='wish'?'wish':'')+'">'+(dest==='stock'?'<button class="icon '+(r.priority?'on':'')+'" data-action="priority" data-i="'+i+'">💫</button><button class="icon '+(r.frozen?'on':'')+'" data-action="frozen" data-i="'+i+'">❄️</button>':'')+'<input class="name" data-action="name" data-i="'+i+'" value="'+esc(r.name)+'" aria-label="アイテム名"><button class="qty" data-action="qty" data-i="'+i+'">'+esc([r.qty,r.unit].filter(Boolean).join(''))+'</button><button class="more" data-action="edit" data-i="'+i+'" aria-label="詳細編集">⋮</button></div>'+((dest==='stock'&&(r.date||r.memo))||(dest==='wish'&&r.memo)?'<div class="extra '+(dest==='wish'?'wish':'')+'">'+(dest==='stock'&&r.date?'ストック日 '+esc(r.date.slice(5).replace('-','/'))+'　':'')+(r.memo?'メモ：'+esc(r.memo):'')+'</div>':'')+'</div>').join('')+'</div>').join('')+'</div>').join('')||'<div class="empty">アイテムがありません</div>';}
function opts(el,cat){el.innerHTML=cats.map((c,i)=>'<option value="'+i+'">'+esc(c)+'</option>').join('');el.value=cat;}
function toggleEditIcon(id,v){$(id).classList.toggle('on',v);$(id).textContent=(id==='ep'?'💫':'❄️')+' '+(v?'ON':'OFF');$(id).setAttribute('aria-pressed',String(v));}
let draft=null;function openEdit(i){idx=i;draft={...rows[i]};$('en').value=draft.name;$('eq').value=draft.qty;$('eu').value=draft.unit;opts($('ec'),draft.cat);opts($('ew'),draft.cat);$('ed').value=draft.date;$('em').value=draft.memo;$('wm').value=draft.memo;toggleEditIcon('ep',draft.priority);toggleEditIcon('ef',draft.frozen);$('stockLine').hidden=dest!=='stock';$('stockThird').hidden=dest!=='stock';$('wishLine').hidden=dest!=='wish';$('edit').showModal();}
function close(){if($('edit').open)$('edit').close();}
$('columns').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const i=Number(b.dataset.i),a=b.dataset.action,r=rows[i];if(a==='name')return;if(a==='priority'||a==='frozen'){r[a]=!r[a];render();return;}if(a==='edit'){openEdit(i);return;}if(a==='qty'){const n=prompt('数量を入力（空欄で未指定）',r.qty);if(n!==null){r.qty=n.trim();render();}}});
$('columns').addEventListener('change',e=>{if(e.target.dataset.action==='name'){rows[Number(e.target.dataset.i)].name=e.target.value;}});
$('ep').onclick=()=>{draft.priority=!draft.priority;toggleEditIcon('ep',draft.priority);};$('ef').onclick=()=>{draft.frozen=!draft.frozen;toggleEditIcon('ef',draft.frozen);};
$('change').onclick=()=>{const name=$('en').value.trim();if(!name){alert('アイテム名を入力してください');return;}Object.assign(rows[idx],{name,qty:$('eq').value.trim(),unit:$('eu').value.trim(),cat:Number(dest==='stock'?$('ec').value:$('ew').value),priority:draft.priority,frozen:draft.frozen,date:$('ed').value,memo:dest==='stock'?$('em').value:$('wm').value});close();render();};
$('delete').onclick=()=>{if(confirm('このアイテムを確認リストから削除します。削除すると元に戻せません。よろしいですか？')){rows.splice(idx,1);close();render();}};
$('exit').onclick=$('cancel').onclick=close;$('clearDate').onclick=()=>{$('ed').value='';};
$('stockBtn').onclick=()=>setDest('stock');$('wishBtn').onclick=()=>setDest('wish');$('parse').onclick=parse;$('example').onclick=()=>{$('input').value='かぼちゃ1個、玉ねぎ 3個、ひき肉1パック';parse();};
$('save').onclick=()=>alert('これは画面確認用サンプルです。実際のリストには保存しません。');
render();
})();
</script></body></html>
